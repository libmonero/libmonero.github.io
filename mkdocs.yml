site_name: Libmonero
site_description: Libraries for building Monero applications, in the language you already use.
site_url: https://libmonero.github.io/
site_dir: public

copyright: '© 2026 Libmonero under <a href="https://opensource.org/licenses/MIT">MIT</a>'

repo_name: libmonero/libmonero.github.io
repo_url: https://github.com/libmonero/libmonero.github.io
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Libraries: libraries.md
  - Examples:
      - Overview: examples/index.md
      - RPC connection: examples/rpc-connection.md
      - Daemon: examples/daemon.md
      - Wallets:
          - Wallet types: examples/wallets/index.md
          - Wallet RPC: examples/wallets/rpc.md
          - Full wallet: examples/wallets/full.md
          - Keys wallet: examples/wallets/keys.md
          - View-only and offline: examples/wallets/view-only-offline.md
          - Multisig: examples/wallets/multisig.md
      - Transactions: examples/transactions.md
      - Notifications: examples/notifications.md
  - Contributing: contributing.md

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  logo: images/logo.png
  favicon: images/favicon.png

extra_css:
  - extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/libmonero
      name: Libmonero on GitHub
    - icon: simple/matrix
      link: https://matrix.to/#/%23monero-python:monero.social
      name: Matrix

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
